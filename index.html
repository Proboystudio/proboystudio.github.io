<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#11111b" />
  <title>Coming Soon — Working On Something New</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      background: #0c0d17;
      isolation: isolate;
    }
    .rainbow {
      position: fixed;
      inset: -50%;
      z-index: -2;
      background: conic-gradient(from 0deg,
        #ff3c71, #ff9f43, #ffe65b, #53f59b, #35d9ff,
        #5674ff, #b65cff, #ff4fb7, #ff3c71);
      animation: spin 18s linear infinite;
      filter: blur(95px) saturate(1.2);
      opacity: .62;
    }
    .shade {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(ellipse at center, rgba(11, 12, 24, .56), rgba(7, 8, 16, .91));
    }
    .card {
      width: min(90vw, 760px);
      padding: clamp(28px, 6vw, 64px) clamp(20px, 5vw, 54px);
      text-align: center;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 28px;
      background: rgba(14, 15, 29, .48);
      box-shadow: 0 24px 90px rgba(0,0,0,.32), inset 0 1px rgba(255,255,255,.1);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: rise .8s ease-out both;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 15px;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      color: rgba(255,255,255,.9);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #65ffb2; box-shadow: 0 0 14px #65ffb2;
      animation: pulse 1.5s ease-in-out infinite;
    }
    h1 {
      margin: 25px 0 12px;
      font-size: clamp(2.7rem, 10vw, 6.4rem);
      line-height: .98;
      letter-spacing: -.065em;
      font-weight: 950;
      text-transform: uppercase;
    }
    .gradient-text {
      display: block;
      padding-bottom: .08em;
      color: transparent;
      background: linear-gradient(90deg, #ff6a9c, #ffc966, #fff477, #65ffbd, #65d9ff, #a98bff, #ff83e3, #ff6a9c);
      background-size: 300% 100%;
      background-clip: text;
      -webkit-background-clip: text;
      animation: colors 7s linear infinite;
      filter: drop-shadow(0 6px 25px rgba(130, 100, 255, .18));
    }
    .subtitle {
      margin: 0;
      color: rgba(255,255,255,.86);
      font-size: clamp(1.05rem, 3.6vw, 1.65rem);
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .message {
      max-width: 490px;
      margin: 20px auto 0;
      color: rgba(255,255,255,.72);
      font-size: clamp(.95rem, 2.4vw, 1.1rem);
      line-height: 1.7;
    }
    .progress {
      height: 5px;
      max-width: 310px;
      margin: 30px auto 0;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.15);
    }
    .progress span {
      display: block;
      width: 45%; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, #ff6a9c, #ffe56b, #64f5c0, #72caff, #bc80ff);
      animation: loading 2.2s ease-in-out infinite alternate;
    }
    footer {
      margin-top: 28px;
      color: rgba(255,255,255,.55);
      font-size: .78rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes colors { to { background-position: 300% 0; } }
    @keyframes pulse { 50% { opacity: .45; transform: scale(.78); } }
    @keyframes loading { from { transform: translateX(-10%); } to { transform: translateX(145%); } }
    @keyframes rise { from { opacity: 0; transform: translateY(20px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="rainbow" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>
  <main class="card">
    <div class="eyebrow"><span class="dot"></span> Something new is loading</div>
    <h1><span class="gradient-text">Coming Soon</span></h1>
    <p class="subtitle">Working On Something New</p>
    <p class="message">Something new is in progress.<br />Stay tuned for updates.</p>
    <div class="progress" aria-label="Loading animation"><span></span></div>
    <footer>PROBOY STUDIO · NEW PROJECT IN PROGRESS</footer>
  </main>
</body>
</html>
